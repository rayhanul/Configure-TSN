# IEEE 802.1AS (gPTP) grandmaster, linuxptp ptp4l, Intel I210 (igb) / I225-I226 (igc).
# Identical to gptp_slave.cfg except priority1/priority2: the lowest priority1 in the network wins.
[global]
# ---- 802.1AS profile ----
gmCapable               1
priority1               128
priority2               128
domainNumber            0
transportSpecific       0x1
ptp_dst_mac             01:80:C2:00:00:0E
network_transport       L2
delay_mechanism         P2P
time_stamping           hardware
follow_up_info          1
path_trace_enabled      1
assume_two_step         1
# ---- message intervals (must match the switches' gPTP ports) ----
logAnnounceInterval     0
logSyncInterval         -3
logMinPdelayReqInterval 0
announceReceiptTimeout  3
syncReceiptTimeout      3
neighborPropDelayThresh 800
min_neighbor_prop_delay -20000000
# igb/igc can take longer than the 1 ms default to deliver a TX timestamp
tx_timestamp_timeout    50
# ---- servo ----
clock_servo             pi
first_step_threshold    0.00002
step_threshold          0.0
summary_interval        0
